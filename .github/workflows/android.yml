name: Android Build

on:
  push:
    branches: [ "feature/dtech-vpn-initial-setup-5320483947374856572" ]
  pull_request:
    branches: [ "feature/dtech-vpn-initial-setup-5320483947374856572" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: sdkmanager "ndk;25.2.9519653"

    - name: Install Gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init

    - name: Build Hysteria AAR
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        cd app/src/main/go

        # 1. Standard dependency setup (No Vendor)
        go mod tidy
        go get golang.org/x/mobile/bind

        # 2. Update to latest tun2socks (Fixes goready error)
        go get github.com/xjasonlyu/tun2socks/v2@latest
        go mod tidy

        # 3. CRITICAL FIX: Patch the Module Cache directly
        # We find the gvisor directory in the cache, make it writable, and delete the bad file.
        GVISOR_DIR=$(go list -m -f '{{.Dir}}' gvisor.dev/gvisor)

        # If gvisor is missing for some reason, download it first
        if [ -z "$GVISOR_DIR" ]; then
            go get gvisor.dev/gvisor@latest
            GVISOR_DIR=$(go list -m -f '{{.Dir}}' gvisor.dev/gvisor)
        fi

        echo "Patching gVisor at: $GVISOR_DIR"
        chmod -R +w "$GVISOR_DIR"
        find "$GVISOR_DIR/pkg/tcpip/stack" -name "bridge_test.go" -delete || true

        # 4. Compile (Standard mode)
        mkdir -p ../../../libs
        gomobile bind -target=android -androidapi 21 -o ../../../libs/hysteria.aar .

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
