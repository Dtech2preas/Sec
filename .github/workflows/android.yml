name: Android Build

on:
  push:
    branches: [ "feature/dtech-vpn-initial-setup-5320483947374856572" ]
  pull_request:
    branches: [ "feature/dtech-vpn-initial-setup-5320483947374856572" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: sdkmanager "ndk;25.2.9519653"

    - name: Install Gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init

    - name: Build Hysteria AAR
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        cd app/src/main/go
        
        # 1. Clean up modules
        go mod tidy
        
        # 2. FIX: Install the missing Mobile Bind dependency
        go get golang.org/x/mobile/bind
        
        # 3. FIX: Force update gvisor to fix the 'undefined: goready' error
        go get -u gvisor.dev/gvisor@latest
        
        # 4. Update all other dependencies to match
        go get -u ./...
        go mod tidy
        
        # 5. Compile
        mkdir -p ../../../libs
        gomobile bind -target=android -androidapi 21 -o ../../../libs/hysteria.aar .

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
