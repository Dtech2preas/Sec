name: Android Build

on:
  push:
    branches: [ "feature/dtech-vpn-initial-setup-5320483947374856572" ]
  pull_request:
    branches: [ "feature/dtech-vpn-initial-setup-5320483947374856572" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: sdkmanager "ndk;25.2.9519653"

    - name: Install Gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init

    - name: Build Hysteria AAR
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        cd app/src/main/go

        # 1. Tidy modules
        go mod tidy

        # 2. Install Mobile Bind (Required for Gomobile)
        go get golang.org/x/mobile/bind

        # 3. Update tun2socks to latest stable (Fixes 'goready' error)
        go get github.com/xjasonlyu/tun2socks/v2@latest
        go mod tidy

        # 4. Vendor the dependencies so we can modify them
        go mod vendor

        # 4.5. Fix Gomobile missing Java files in vendor
        # go mod vendor excludes non-Go files, but gomobile bind needs them.
        MOBILE_DIR=$(go list -mod=readonly -m -f '{{.Dir}}' golang.org/x/mobile)
        mkdir -p vendor/golang.org/x/mobile/bind
        cp -r "$MOBILE_DIR/bind/java" vendor/golang.org/x/mobile/bind/
        # Make the directory writable because it was copied from the read-only module cache
        chmod -R +w vendor/golang.org/x/mobile/bind/java
        # Create a dummy Go file to satisfy gomobile's package check in vendor mode
        echo "package java" > vendor/golang.org/x/mobile/bind/java/dummy.go

        # 5. CRITICAL FIX: Delete the conflicting test file from gVisor
        # This file defines 'package bridge' inside the 'package stack' folder, crashing the compiler.
        find vendor/gvisor.dev/gvisor/pkg/tcpip/stack -name "bridge_test.go" -delete || true

        # 6. Compile using the vendor directory (-mod=vendor)
        mkdir -p ../../../libs
        export GOFLAGS="-mod=vendor"
        gomobile bind -target=android -androidapi 21 -o ../../../libs/hysteria.aar .

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
